name: Native Linux OpenGL

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - codex/native-linux-apollo11-baseline
  push:
    branches: [codex/native-linux-apollo11-baseline]
    paths: [.github/native-linux/**, .github/workflows/native-linux-opengl.yml]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete mission replay matrix
        type: boolean
        default: false
      apollo7_full_flight:
        description: Fly Apollo 7 from the original countdown to recovery on one save chain
        type: boolean
        default: false
      apollo7_linked_return:
        description: Fly the linked Apollo 7 return from the corrected SPS-3 save
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-linux-opengl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  orbiter:
    name: Build pinned Orbiter and matching SDK
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 60
    if: github.event.action != 'labeled' || github.event.label.name == 'full-native-linux'
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
      archive_sha256: ${{ steps.package.outputs.sha256 }}
      suites: ${{ steps.suites.outputs.suites }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git cmake ninja-build pkg-config curl python3 \
            ca-certificates zstd patch unzip qt6-base-dev libgl-dev libglu1-mesa-dev zlib1g-dev xorg-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request checkout is the test merge. Its first parent is the base.
          fetch-depth: 2
          sparse-checkout: .github/native-linux
      - name: Read the pinned Orbiter revision
        id: pin
        run: |
          revision=$(cat .github/native-linux/orbiter-revision)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dcajacob/orbiter-cross-platform
          ref: ${{ steps.pin.outputs.revision }}
          path: orbiter-source
          persist-credentials: false
      - name: Build the shared runtime and SDK from Orbiter
        id: package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/orbiter-source"
          bash .github/native-linux/build-orbiter.sh "$PWD/orbiter-source" "$RUNNER_TEMP/shared-orbiter"
          archive=orbiter-host.tar.zst
          mv "$RUNNER_TEMP/shared-orbiter/$archive" "$archive"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: shared-orbiter-runtime-sdk
          path: orbiter-host.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Select mission suites
        id: suites
        env:
          COUNTDOWN: ${{ inputs.apollo7_full_flight }}
          LINKED: ${{ inputs.apollo7_linked_return }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full || contains(github.event.pull_request.labels.*.name, 'full-native-linux') }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          suites = ["lunar-smoke"]
          if os.environ["FULL"] == "true":
              rows = Path(".github/native-linux/replays.tsv").read_text().splitlines()
              suites = list(dict.fromkeys(row.split()[0] for row in rows if row.strip()))
          linked = os.environ.get("LINKED") == "true"
          countdown = os.environ.get("COUNTDOWN") == "true"
          if os.environ["EVENT"] == "pull_request":
              # Keep the short smoke check for unrelated PRs. Run the linked flight
              # automatically when the crew procedures or Apollo 7 targeting change.
              paths = [".github/native-linux/apollo7*", "Script/ProjectApollo/apollo7*",
                       ":(glob)**/RTCC_Mission_C.cpp", ":(glob)**/MCC_Mission_C.cpp"]
              changed = subprocess.run(["git", "-c", f"safe.directory={Path.cwd()}", "diff",
                                        "--name-only", "HEAD^1", "HEAD", "--", *paths],
                                       capture_output=True, text=True, check=True)
              linked = linked or bool(changed.stdout.strip())
              countdown = countdown or bool(changed.stdout.strip())
          if linked or os.environ["FULL"] == "true":
              suites.append("apollo7-linked-return")
          if countdown or os.environ["FULL"] == "true":
              suites.append("apollo7-countdown-recovery")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("suites=" + json.dumps(suites), file=out)
          PYTHON

  native-linux:
    needs: orbiter
    name: Native Linux OpenGL (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.orbiter.outputs.suites) }}
    runs-on: ubuntu-24.04
    # The pinned Orbiter runtime and SDK were built on Ubuntu 26.04.
    container: ubuntu:26.04
    timeout-minutes: ${{ matrix.suite == 'apollo7-countdown-recovery' && 350 || matrix.suite == 'apollo7-linked-return' && 300 || 75 }}
    env:
      ORBITER_REVISION: ${{ needs.orbiter.outputs.revision }}
      REPLAY_SUITE: ${{ matrix.suite }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build and virtual desktop dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 git rsync curl unzip zstd ca-certificates \
            zlib1g-dev libglu1-mesa-dev libgl-dev libglx-mesa0 libgl1-mesa-dri libegl1 libopengl0 \
            libqt6widgets6 libxcb-cursor0 libxtst6 fonts-dejavu-core \
            xvfb xauth x11-utils pulseaudio pulseaudio-utils

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: shared-orbiter-runtime-sdk
          path: shared-host

      - name: Verify matching Orbiter host and SDK and fetch mission data
        env:
          HOST_SHA256: ${{ needs.orbiter.outputs.archive_sha256 }}
          FIXTURE_URL: https://github.com/dcajacob/NASSP/releases/download/native-linux-ci-inputs-v1/nassp-native-ci-inputs-v1.tar.zst
          FIXTURE_SHA256: 26d5891ea54a01ab8d007bed3ab2e9f5ed46ff8cd315921c57ca0e334faf37bd
          TERRAIN_URL: https://github.com/dcajacob/NASSP/releases/download/native-linux-ci-inputs-v1/nassp-native-ci-terrain-v1.tar.zst
          TERRAIN_SHA256: 00e2e3d7198684a58ec4c96a148a485759d1695667e030416399a017dbe977db
          STOCK_URL: https://github.com/dcajacob/orbiter-cross-platform/releases/download/production-inputs-v2/production-stock-data-v1.zip
          STOCK_SHA256: b70a4065ceda469e4b0f35d3d8935138483873fdb8d8eb2dd6b99829f8ce0cb3
          KERNEL_SHA256: f98bd1a789fca05e0a1148db6d4b6d20ff7146896864bb04e4aac9c190371f83
        run: |
          mkdir -p "$RUNNER_TEMP/nassp-inputs"
          cd "$RUNNER_TEMP/nassp-inputs"
          curl --fail --location --retry 3 --output fixture.tar.zst "$FIXTURE_URL"
          printf '%s  fixture.tar.zst\n' "$FIXTURE_SHA256" | sha256sum -c -
          # The old archive still supplies the frozen scenarios, settings and flight data.
          tar --zstd --exclude='./runtime/engine' --exclude='./sdk' -xf fixture.tar.zst
          test ! -e runtime/engine
          test ! -e sdk
          host="$GITHUB_WORKSPACE/shared-host/orbiter-host.tar.zst"
          printf '%s  %s\n' "$HOST_SHA256" "$host" | sha256sum -c -
          tar --zstd -xf "$host"
          test "$(cat orbiter-source.txt)" = "$ORBITER_REVISION"
          rm fixture.tar.zst
          curl --fail --location --retry 3 --output terrain.tar.zst "$TERRAIN_URL"
          printf '%s  terrain.tar.zst\n' "$TERRAIN_SHA256" | sha256sum -c -
          tar --zstd -xf terrain.tar.zst -C runtime/planet-archives
          rm terrain.tar.zst
          curl --fail --location --retry 3 --output stock.zip "$STOCK_URL"
          printf '%s  stock.zip\n' "$STOCK_SHA256" | sha256sum -c -
          kernel=runtime/celestial-data/Kernels/orbiter.bsp
          mkdir -p "$(dirname "$kernel")"
          unzip -p stock.zip Kernels/orbiter.bsp > "$kernel"
          printf '%s  %s\n' "$KERNEL_SHA256" "$kernel" | sha256sum -c -
          rm stock.zip

      - name: Fetch and verify the additional Apollo replays
        if: matrix.suite != 'baseline' && matrix.suite != 'lunar-smoke'
        env:
          APOLLO_REPLAYS_URL: https://github.com/dcajacob/NASSP/releases/download/native-linux-ci-inputs-v1/nassp-native-ci-apollo-replays-v2.tar.zst
          APOLLO_REPLAYS_SHA256: dca7b28fa1543cee718c599c2a71449ae0b40c73b50cb50e5e7839c938e482ae
        run: |
          cd "$RUNNER_TEMP/nassp-inputs"
          curl --fail --location --retry 3 --output apollo-replays.tar.zst "$APOLLO_REPLAYS_URL"
          printf '%s  apollo-replays.tar.zst\n' "$APOLLO_REPLAYS_SHA256" | sha256sum -c -
          tar --zstd --exclude='runtime/engine' --exclude='sdk' -xf apollo-replays.tar.zst
          rm apollo-replays.tar.zst

      - name: Fetch and verify Apollo 7, 9 and 12 replays
        if: startsWith(matrix.suite, 'apollo7') || startsWith(matrix.suite, 'apollo9') || startsWith(matrix.suite, 'apollo12')
        env:
          MISSION_REPLAYS_URL: https://github.com/dcajacob/NASSP/releases/download/native-linux-ci-inputs-v1/nassp-native-ci-apollo7912-v1.tar.zst
          MISSION_REPLAYS_SHA256: ad5db0be887006431d41511c7cf5eb00bbfbf0683d0aefdcef1980469fb3ad54
        run: |
          cd "$RUNNER_TEMP/nassp-inputs"
          curl --fail --location --retry 3 --output mission-replays.tar.zst "$MISSION_REPLAYS_URL"
          printf '%s  mission-replays.tar.zst\n' "$MISSION_REPLAYS_SHA256" | sha256sum -c -
          tar --zstd --exclude='runtime/engine' --exclude='sdk' -xf mission-replays.tar.zst
          rm mission-replays.tar.zst

      - name: Build NASSP against the shared SDK
        id: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          mkdir -p "nassp-results"
          bash .github/native-linux/run.sh "$RUNNER_TEMP/nassp-inputs" "nassp-results" build \
            2>&1 | tee "nassp-results/build.log"

      - name: Fly and reload the frozen Apollo 11 lunar orbit with sound off
        if: matrix.suite == 'lunar-smoke'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' python3 -B \
            .github/native-linux/lunar_smoke.py "$RUNNER_TEMP/nassp-inputs" nassp-results

      - name: Check the Orbiter Launchpad
        id: launcher
        if: matrix.suite == 'baseline'
        run: bash .github/native-linux/run.sh "$RUNNER_TEMP/nassp-inputs" "nassp-results" launcher

      - name: Fly the replay scenarios
        if: ${{ !cancelled() && matrix.suite != 'lunar-smoke' && steps.build.outcome == 'success' }}
        run: bash .github/native-linux/run.sh "$RUNNER_TEMP/nassp-inputs" "nassp-results" flight "$REPLAY_SUITE"

      - name: Verify and summarize results
        if: matrix.suite != 'lunar-smoke'
        run: |
          python3 .github/native-linux/verify.py "$RUNNER_TEMP/nassp-inputs/launcher-manifest.json" \
            "nassp-results" "$REPLAY_SUITE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite == 'baseline' && 'native-linux-opengl-results' || format('native-linux-opengl-{0}-results', matrix.suite) }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            nassp-results/
            !nassp-results/build/**
            !nassp-results/**/lvlog1b.txt
