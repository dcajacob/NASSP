name: Native Linux OpenGL

on:
  pull_request:
    branches:
      - codex/native-linux-apollo11-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-opengl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Native Linux OpenGL (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, apollo5, apollo10-lunar, apollo10-entry, apollo11-lunar, apollo11-return, apollo11-entry]
    runs-on: ubuntu-24.04
    # The pinned Orbiter runtime and SDK were built on Ubuntu 26.04.
    container: ubuntu:26.04
    timeout-minutes: 75
    env:
      REPLAY_SUITE: ${{ matrix.suite }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build and virtual desktop dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 git rsync curl unzip zstd ca-certificates \
            zlib1g-dev libglu1-mesa-dev libgl-dev libglx-mesa0 libgl1-mesa-dri libegl1 libopengl0 \
            libqt6widgets6 libxcb-cursor0 libxtst6 fonts-dejavu-core \
            xvfb xauth x11-utils pulseaudio pulseaudio-utils

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch and verify Orbiter runtime, SDK and replay inputs
        env:
          FIXTURE_URL: https://github.com/dcajacob/NASSP/releases/download/native-linux-ci-inputs-v1/nassp-native-ci-inputs-v1.tar.zst
          FIXTURE_SHA256: 26d5891ea54a01ab8d007bed3ab2e9f5ed46ff8cd315921c57ca0e334faf37bd
          TERRAIN_URL: https://github.com/dcajacob/NASSP/releases/download/native-linux-ci-inputs-v1/nassp-native-ci-terrain-v1.tar.zst
          TERRAIN_SHA256: 00e2e3d7198684a58ec4c96a148a485759d1695667e030416399a017dbe977db
          STOCK_URL: https://github.com/dcajacob/orbiter-cross-platform/releases/download/production-inputs-v2/production-stock-data-v1.zip
          STOCK_SHA256: b70a4065ceda469e4b0f35d3d8935138483873fdb8d8eb2dd6b99829f8ce0cb3
          KERNEL_SHA256: f98bd1a789fca05e0a1148db6d4b6d20ff7146896864bb04e4aac9c190371f83
        run: |
          mkdir -p "$RUNNER_TEMP/nassp-inputs"
          cd "$RUNNER_TEMP/nassp-inputs"
          curl --fail --location --retry 3 --output fixture.tar.zst "$FIXTURE_URL"
          printf '%s  fixture.tar.zst\n' "$FIXTURE_SHA256" | sha256sum -c -
          tar --zstd -xf fixture.tar.zst
          rm fixture.tar.zst
          curl --fail --location --retry 3 --output terrain.tar.zst "$TERRAIN_URL"
          printf '%s  terrain.tar.zst\n' "$TERRAIN_SHA256" | sha256sum -c -
          tar --zstd -xf terrain.tar.zst -C runtime/planet-archives
          rm terrain.tar.zst
          curl --fail --location --retry 3 --output stock.zip "$STOCK_URL"
          printf '%s  stock.zip\n' "$STOCK_SHA256" | sha256sum -c -
          kernel=runtime/celestial-data/Kernels/orbiter.bsp
          mkdir -p "$(dirname "$kernel")"
          unzip -p stock.zip Kernels/orbiter.bsp > "$kernel"
          printf '%s  %s\n' "$KERNEL_SHA256" "$kernel" | sha256sum -c -
          rm stock.zip

      - name: Fetch and verify the additional Apollo replays
        if: matrix.suite != 'baseline'
        env:
          APOLLO_REPLAYS_URL: https://github.com/dcajacob/NASSP/releases/download/native-linux-ci-inputs-v1/nassp-native-ci-apollo-replays-v2.tar.zst
          APOLLO_REPLAYS_SHA256: dca7b28fa1543cee718c599c2a71449ae0b40c73b50cb50e5e7839c938e482ae
        run: |
          cd "$RUNNER_TEMP/nassp-inputs"
          curl --fail --location --retry 3 --output apollo-replays.tar.zst "$APOLLO_REPLAYS_URL"
          printf '%s  apollo-replays.tar.zst\n' "$APOLLO_REPLAYS_SHA256" | sha256sum -c -
          tar --zstd -xf apollo-replays.tar.zst
          rm apollo-replays.tar.zst

      - name: Build NASSP from the PR
        id: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          mkdir -p "nassp-results"
          bash .github/native-linux/run.sh "$RUNNER_TEMP/nassp-inputs" "nassp-results" build \
            2>&1 | tee "nassp-results/build.log"

      - name: Check the Orbiter Launchpad
        id: launcher
        if: matrix.suite == 'baseline'
        run: bash .github/native-linux/run.sh "$RUNNER_TEMP/nassp-inputs" "nassp-results" launcher

      - name: Fly the replay scenarios
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash .github/native-linux/run.sh "$RUNNER_TEMP/nassp-inputs" "nassp-results" flight "$REPLAY_SUITE"

      - name: Verify and summarize results
        run: |
          python3 .github/native-linux/verify.py "$RUNNER_TEMP/nassp-inputs/launcher-manifest.json" \
            "nassp-results" "$REPLAY_SUITE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite == 'baseline' && 'native-linux-opengl-results' || format('native-linux-opengl-{0}-results', matrix.suite) }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            nassp-results/
            !nassp-results/build/**
